<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewsHub — Detalle de noticia</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="encabezado">
      <div class="contenedor">
        <div class="logo"><img src="assets/logo_white.svg" alt="Logo de Frontera news" />FRONTERA<span>NEWS</span></div>
        <nav class="nav">
          <a href="index.html">Inicio</a>
          <a href="noticias.html" class="activo">Noticias</a>
          <a href="favoritos.html">Favoritos</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <main>
      <article id="detalle-contenedor" class="detalle">
        <img id="detalle-imagen" class="detalle-imagen" src="" alt="" />
        <p class="detalle-meta"><span id="detalle-categoria"></span> · <span id="detalle-fecha"></span></p>
        <h1 id="detalle-titulo"></h1>
        <p id="detalle-contenido" class="detalle-contenido"></p>

        <div class="acciones-detalle">
          <button id="boton-favorito" class="boton-secundario"></button>
          <a class="boton-secundario" href="contacto.html">Contactar</a>
        </div>
      </article>

      <div id="detalle-no-encontrada" class="detalle" hidden>
        <h1>Noticia no encontrada</h1>
        <p>La noticia que buscas no existe o fue eliminada. <a href="noticias.html">Volver al catálogo</a>.</p>
      </div>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <span>© 2026 NewsHub — Proyecto académico de Desarrollo Front-end</span>
        <a href="contacto.html">Contáctanos</a>
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/favoritos.js"></script>
    <script src="js/detalle.js"></script>
  </body>
</html>
